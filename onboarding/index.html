const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},k,u(D.c));
  return new TextDecoder().decode(pt);
}
async function show(pw,remember){
  const html=await open(pw);
  if(remember){try{localStorage.setItem("vp_pw",pw)}catch(_){}}
  document.open();document.write(html);document.close();
}
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();const b=document.getElementById("b"),e=document.getElementById("e");
  b.disabled=true;b.textContent="Проверяю…";e.textContent="";
  try{await show(document.getElementById("p").value,true)}catch(_){e.textContent="Неверный пароль";b.disabled=false;b.textContent="Открыть"}
});
(async()=>{let pw=null;try{pw=localStorage.getItem("vp_pw")}catch(_){}if(pw){try{await show(pw,false)}catch(_){}}})();
